name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create Releases on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Surface secrets as env so we can branch on their presence.
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      APEXHUB_PUBLIC_KEY: ${{ secrets.APEXHUB_PUBLIC_KEY }}
      APEXHUB_APP_ID: ${{ secrets.APEXHUB_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore (if configured)
        id: signing
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release signing key detected — building a signed release."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets — release will be signed with the debug key."
          fi

      - name: Assemble optional gradle properties
        id: props
        run: |
          ARGS=""
          if [ -n "$APEXHUB_PUBLIC_KEY" ]; then ARGS="$ARGS -PAPEXHUB_PUBLIC_KEY=$APEXHUB_PUBLIC_KEY"; fi
          if [ -n "$APEXHUB_APP_ID" ]; then ARGS="$ARGS -PAPEXHUB_APP_ID=$APEXHUB_APP_ID"; fi
          echo "gradle_args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace ${{ steps.props.outputs.gradle_args }}

      - name: Locate & rename APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then echo "::error::No APK produced"; exit 1; fi
          OUT="qr-ify-${{ github.ref_name }}.apk"
          OUT="$(echo "$OUT" | tr '/' '-')"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "Built: $OUT (signed=${{ steps.signing.outputs.signed }})"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qr-ify-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
