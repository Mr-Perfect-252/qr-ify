name: Create Keystore & Save Secrets

# Run this ONCE (manually) to generate a release signing keystore and store it
# — together with randomly generated passwords — as repository Actions secrets:
#   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD,
#   SIGNING_KEY_ALIAS,       SIGNING_KEY_PASSWORD
#
# The "Build APK" workflow then decodes these to sign release builds.
#
# Requirements:
#   - A repo secret named GH_PAT holding a Personal Access Token with `repo`
#     scope (the default GITHUB_TOKEN cannot create/update secrets).
#
# WARNING: Re-running this REPLACES your signing key. Android will refuse to
# update an already-installed app that was signed with the previous key, so
# only regenerate if you have no released builds you need to update in place.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "Key alias to create"
        required: true
        default: "qrify"
      validity_days:
        description: "Certificate validity in days"
        required: true
        default: "10000"
      dname:
        description: "Certificate distinguished name"
        required: true
        default: "CN=QR-ify, OU=Mobile, O=QR-ify, L=NA, ST=NA, C=NA"
      confirm:
        description: "Type 'yes' to confirm (this REPLACES any existing signing key)"
        required: true
        default: "no"

permissions:
  contents: read

jobs:
  create-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Guard against accidental key replacement
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes" ]; then
            echo "::error::You must set the 'confirm' input to 'yes' to proceed."
            exit 1
          fi

      - name: Verify GH_PAT secret is present
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Repo secret GH_PAT is not set. Add a PAT with 'repo' scope named GH_PAT."
            exit 1
          fi

      - name: Set up JDK 17 (for keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore with random passwords
        id: gen
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)"
          KEY_PASSWORD="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)"
          ALIAS="${{ github.event.inputs.key_alias }}"

          keytool -genkeypair \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity "${{ github.event.inputs.validity_days }}" \
            -storetype PKCS12 \
            -keystore release.keystore \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "${{ github.event.inputs.dname }}"

          echo "Keystore created:"
          keytool -list -keystore release.keystore -storepass "$STORE_PASSWORD"

          KEYSTORE_BASE64="$(base64 -w0 release.keystore)"

          # Mask so nothing leaks into logs
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          # Hand values to the next step via the (already masked) step env file
          {
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEYSTORE_BASE64=$KEYSTORE_BASE64"
          } >> "$GITHUB_ENV"

      - name: Save keystore & passwords to repo secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          gh secret set SIGNING_KEYSTORE_BASE64 --repo "${{ github.repository }}" --body "$KEYSTORE_BASE64"
          gh secret set SIGNING_STORE_PASSWORD  --repo "${{ github.repository }}" --body "$STORE_PASSWORD"
          gh secret set SIGNING_KEY_ALIAS       --repo "${{ github.repository }}" --body "$KEY_ALIAS"
          gh secret set SIGNING_KEY_PASSWORD    --repo "${{ github.repository }}" --body "$KEY_PASSWORD"
          echo "### Signing secrets saved ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- SIGNING_KEYSTORE_BASE64" >> "$GITHUB_STEP_SUMMARY"
          echo "- SIGNING_STORE_PASSWORD"  >> "$GITHUB_STEP_SUMMARY"
          echo "- SIGNING_KEY_ALIAS (\`$KEY_ALIAS\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- SIGNING_KEY_PASSWORD"    >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "You can now run **Build APK** to produce a signed release APK." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up local keystore file
        if: always()
        run: rm -f release.keystore
