# ---------------------------------------------------------------------------
# ApexHub OTA auto-update configuration  (EDIT ME)
# ---------------------------------------------------------------------------
# These values are read at build time and baked into BuildConfig, then used by
# QrifyApp.kt (ApexHubUpdater init) and MainActivity.kt (checkAndPrompt).
#
# Get these from your ApexHub Console → Settings.
# You can edit them here directly; changes take effect on the next build.
#
# Override precedence (highest first):
#   1. -PAPEXHUB_PUBLIC_KEY=... on the Gradle command line, or the
#      APEXHUB_PUBLIC_KEY GitHub Actions secret (injected by build-apk.yml)
#   2. the values in this file
#   3. built-in placeholders (update checks no-op until replaced)
# ---------------------------------------------------------------------------

# Your public key from the ApexHub Console (pk_live_...)
APEXHUB_PUBLIC_KEY=pk_live_ThRRmVGstEjm8jYqQu9oXZMGQ7AUh7MP

# Your app id from the ApexHub Console (app_...). Leave as-is until you have one.
APEXHUB_APP_ID=app_REPLACE_ME

# The package ApexHub tracks updates for. Keep in sync with applicationId.
APEXHUB_PACKAGE=com.qrify.app

# Release channel: stable | beta
APEXHUB_CHANNEL=stable
